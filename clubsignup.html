<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Club</title>
</head>
<body>
   <p><h1>Key Club</h1></p>
   <p><h3>Meeting dates: Every Tuesday at Lunch</h3></p>
   <p><h4>Meeting time:11:50am - 12:30pm</h4></p>


<form action="" method="get">


<label for="name">Your Name:</label>
<input type="text" id="name" name="name" placeholder="Enter your name">
<br><br>


<label for="email">Your Email:</label>
<input type="email" id="email" name="email" placeholder="Enter your email">
<br><br>


<label>How many volunteer hours have you done in your life?</label>
<br>


<label for="Amount">Number of Hours:</label>
<select id="amounthours" name="amounthours">
<option value=>0-20</option>
<option value=>21-40 </option>
<option value=>41-60</option>
<option value=>61+</option>
</select>
<br><br>


<label for="reason">Why should we let you join?</label>
<br>


<textarea id="reason" name="reason" cols="30" rows="5"
placeholder="Explain your qualifications..."></textarea>
<br><br>
<input type="submit" value="JOIN KEY CLUB! 🥝">


</form>


</body>
</html>
